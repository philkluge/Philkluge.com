<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent:        #a855f7;
            --accent-dim:    #7c3aed;
            --accent-glow:   #c084fc;
            --blue:          #3b82f6;
            --blue-glow:     #60a5fa;
            --cyan:          #22d3ee;
            --red:           #ef4444;
            --red-glow:      #fca5a5;
            --bg:            #000010;
            --bg-card:       #05051a;
            --text:          #e2e8f0;
            --text-dim:      #94a3b8;
            --border:        rgba(168, 85, 247, 0.35);
            --font-display:  'Orbitron', monospace;
            --font-mono:     'Share Tech Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #starsCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .nebula-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 60% 50% at 15% 30%,  rgba(124,58,237,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 85% 70%,  rgba(59,130,246,0.15) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 50% 50%,  rgba(168,85,247,0.08) 0%, transparent 60%);
            animation: nebulaPulse 12s ease-in-out infinite alternate;
        }

        @keyframes nebulaPulse {
            0%   { opacity: 0.7; }
            50%  { opacity: 1;   }
            100% { opacity: 0.8; }
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 8;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0) 0px,
                rgba(0,0,0,0.15) 1px,
                rgba(0,0,0,0) 2px,
                rgba(0,0,0,0) 4px
            );
            animation: scanMove 15s linear infinite;
        }

        @keyframes scanMove {
            from { transform: translateY(0);   }
            to   { transform: translateY(8px); }
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 9;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,6,0.88) 100%);
        }

        .static {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            opacity: 0.03;
        }

        .card {
            position: relative;
            z-index: 20;
            text-align: center;
            max-width: 640px;
            width: 90%;
            padding: 52px 48px 44px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
            animation: cardFadeIn 0.9s ease both;
        }

        .card::after {
            content: '';
            position: absolute;
            top: -1px; right: -1px;
            width: 20px; height: 20px;
            background: var(--accent-dim);
            clip-path: polygon(100% 0, 100% 100%, 0 0);
            opacity: 0.7;
        }

        .card.mode-offline     { box-shadow: 0 0 40px rgba(239,68,68,0.2),  0 0 80px rgba(239,68,68,0.08); }
        .card.mode-maintenance { box-shadow: 0 0 40px rgba(168,85,247,0.2), 0 0 80px rgba(168,85,247,0.08); }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            border: 1px solid;
            font-size: 0.72rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 28px;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
        }

        .status-badge.offline {
            border-color: rgba(239,68,68,0.6);
            background:   rgba(239,68,68,0.1);
            color: var(--red-glow);
        }

        .status-badge.maintenance {
            border-color: rgba(168,85,247,0.6);
            background:   rgba(168,85,247,0.1);
            color: var(--accent-glow);
        }

        .badge-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            animation: dotBlink 1.4s ease-in-out infinite;
        }

        .offline .badge-dot     { background: var(--red); }
        .maintenance .badge-dot { background: var(--accent); }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.2; }
        }

        .status-icon {
            font-size: 3.8rem;
            margin-bottom: 20px;
            display: block;
            filter: drop-shadow(0 0 16px var(--accent-dim));
            animation: iconFloat 4s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0);    }
            50%       { transform: translateY(-8px); }
        }

        .main-title {
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        .main-title.offline {
            color: var(--red-glow);
            text-shadow: 0 0 20px var(--red), 0 0 50px rgba(239,68,68,0.4);
        }

        .main-title.maintenance {
            color: #fff;
            text-shadow: 0 0 20px var(--accent-glow), 0 0 50px var(--accent-dim);
        }

        @keyframes titleGlow {
            from { filter: brightness(1);   }
            to   { filter: brightness(1.2); }
        }

        .project-name {
            font-family: var(--font-display);
            font-size: 0.85rem;
            letter-spacing: 0.35em;
            color: var(--accent-glow);
            text-transform: uppercase;
            margin-bottom: 24px;
            opacity: 0.8;
        }

        .divider {
            width: 140px;
            height: 1px;
            margin: 0 auto 24px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--blue), transparent);
            box-shadow: 0 0 6px var(--accent);
        }

        .message {
            color: var(--text-dim);
            font-size: 0.93rem;
            line-height: 1.85;
            margin-bottom: 32px;
        }

        .progress-wrap {
            margin-bottom: 28px;
            display: none;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            letter-spacing: 0.1em;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(168,85,247,0.15);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-dim), var(--accent-glow), var(--cyan));
            box-shadow: 0 0 10px var(--accent);
            border-radius: 2px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .info-row {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .info-item .info-label {
            font-size: 0.68rem;
            color: var(--text-dim);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .info-item .info-value {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--accent-glow);
            text-shadow: 0 0 8px rgba(168,85,247,0.5);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 28px;
            background: rgba(168,85,247,0.1);
            border: 1px solid var(--border);
            color: var(--accent-glow);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
        }

        .back-btn:hover {
            background: rgba(168,85,247,0.25);
            border-color: var(--accent);
            box-shadow: 0 0 18px rgba(168,85,247,0.4);
            color: #fff;
        }

        .cursor {
            display: inline-block;
            width: 9px; height: 1.1em;
            background: var(--accent-glow);
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: cursorBlink 1s step-end infinite;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        .page-footer {
            position: fixed;
            bottom: 20px;
            left: 0; right: 0;
            text-align: center;
            z-index: 20;
            font-size: 0.72rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            opacity: 0.45;
        }

        @media (max-width: 520px) {
            .card { padding: 36px 24px 32px; }
            .main-title { font-size: 1.8rem; }
            .info-row { gap: 16px; }
        }
    </style>
</head>
<body>

    <canvas id="starsCanvas" aria-hidden="true"></canvas>
    <div class="nebula-bg"  aria-hidden="true"></div>
    <div class="scanlines"  aria-hidden="true"></div>
    <div class="vignette"   aria-hidden="true"></div>
    <div class="static" id="staticEl" aria-hidden="true"></div>

    <main class="card" id="mainCard" role="main">

        <div class="status-badge" id="statusBadge">
            <span class="badge-dot"></span>
            <span id="badgeText">OFFLINE</span>
        </div>

        <span class="status-icon" id="statusIcon" aria-hidden="true">📡</span>

        <h1 class="main-title" id="mainTitle">CONNECTION LOST</h1>

        <p class="project-name" id="projectName">// PROJECT NAME</p>

        <div class="divider"></div>

        <p class="message" id="mainMessage">
            This page is currently unavailable.<span class="cursor"></span>
        </p>

        <div class="progress-wrap" id="progressWrap">
            <div class="progress-label">
                <span>SYSTEM RESTORE</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
        </div>
        <div class="info-row" id="infoRow"></div>

        <a href="../../index.html" class="back-btn" aria-label="Back to main page">← BACK TO MAIN</a>

    </main>

    <footer class="page-footer">© 2025 Phil Kluge &nbsp;|&nbsp; © 2025 If Games</footer>


















    <script>
    const CONFIG = {
        // offline | maintenance
        mode: "offline",
        project: "MKDD-Ultimate",

        // maintenance options
        maintenance: {
            progress: 65,
            info: [
                { label: "STATUS",   value: "IN PROGRESS" },
                { label: "ETA",      value: "~2 HRS"      },
            ],
            message: "We are currently performing scheduled maintenance. The system will be back online shortly. Thank you for your patience.",
        },

        // offline options
        offline: {
            info: [
                { label: "STATUS",  value: "OFFLINE"  },
                { label: "ERROR",   value: "ERR_503"  },
            ],
            message: "Unable to reach this page. Please check your connection or try again later.",
        },
    };
    (function applyConfig() {
        const mode = CONFIG.mode === "maintenance" ? "maintenance" : "offline";
        const opts = CONFIG[mode];
        document.getElementById('mainCard').classList.add('mode-' + mode);
        const badge = document.getElementById('statusBadge');
        badge.classList.add(mode);
        document.getElementById('badgeText').textContent =
            mode === 'maintenance' ? 'MAINTENANCE' : 'OFFLINE';
        if (mode === 'maintenance') {
            document.getElementById('statusIcon').textContent = '🔧';
            document.getElementById('mainTitle').textContent  = 'MAINTENANCE MODE';
            document.getElementById('mainTitle').classList.add('maintenance');
        } else {
            document.getElementById('statusIcon').textContent = '📡';
            document.getElementById('mainTitle').textContent  = 'CONNECTION LOST';
            document.getElementById('mainTitle').classList.add('offline');
        }
        document.getElementById('projectName').textContent = '// ' + CONFIG.project.toUpperCase();
        document.getElementById('mainMessage').innerHTML =
            opts.message + '<span class="cursor"></span>';
        if (mode === 'maintenance' && CONFIG.maintenance.progress !== null) {
            const wrap = document.getElementById('progressWrap');
            wrap.style.display = 'block';
            setTimeout(() => {
                const pct = Math.min(100, Math.max(0, CONFIG.maintenance.progress));
                document.getElementById('progressFill').style.width = pct + '%';
                document.getElementById('progressText').textContent  = pct + '%';
            }, 600);
        }

        if (opts.info && opts.info.length) {
            const row = document.getElementById('infoRow');
            opts.info.forEach(item => {
                const el = document.createElement('div');
                el.className = 'info-item';
                el.innerHTML = `<span class="info-label">${item.label}</span>
                                <span class="info-value">${item.value}</span>`;
                row.appendChild(el);
            });
        }

        document.title = mode === 'maintenance'
            ? 'Maintenance – ' + CONFIG.project
            : 'Offline – '     + CONFIG.project;
    })();

    (function initStarfield() {
        const canvas = document.getElementById('starsCanvas');
        const ctx    = canvas.getContext('2d');
        let stars = [], shootingStars = [], lastShot = 0, raf;

        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            generateStars();
        }

        function generateStars() {
            const n = Math.floor((canvas.width * canvas.height) / 3800);
            stars = [];
            for (let i = 0; i < n; i++) {
                const s = Math.random();
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: s < 0.6 ? Math.random() * 0.8 + 0.2
                     : s < 0.9 ? Math.random() * 1.2 + 0.6
                     :           Math.random() * 2   + 1.2,
                    a:  Math.random() * 0.6 + 0.3,
                    ts: Math.random() * 0.02 + 0.003,
                    tp: Math.random() * Math.PI * 2,
                    hue: Math.random() < 0.5 ? 0 : Math.random() < 0.5 ? 220 : 270,
                    sat: Math.random() < 0.5 ? 0 : Math.floor(Math.random() * 40 + 30),
                });
            }
        }

        function spawnShot() {
            const angle = (Math.random() * 20 + 20) * Math.PI / 180;
            const speed = Math.random() * 8 + 6;
            shootingStars.push({
                x:  Math.random() * canvas.width  * 0.7,
                y:  Math.random() * canvas.height * 0.4,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                a:  1, trail: [],
            });
        }

        function draw(ts) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(st => {
                st.tp += st.ts;
                const a = st.a * (0.6 + 0.4 * Math.sin(st.tp));
                ctx.fillStyle = st.sat === 0
                    ? `rgba(255,255,255,${a})`
                    : `hsla(${st.hue},${st.sat}%,90%,${a})`;
                ctx.beginPath();
                ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                ctx.fill();

                if (st.r > 1.4) {
                    const g = ctx.createRadialGradient(st.x, st.y, 0, st.x, st.y, st.r * 4);
                    g.addColorStop(0, st.sat === 0
                        ? `rgba(255,255,255,${a * 0.3})`
                        : `hsla(${st.hue},${st.sat}%,90%,${a * 0.25})`);
                    g.addColorStop(1, 'transparent');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.r * 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            if (ts - lastShot > Math.random() * 4000 + 3000) {
                spawnShot(); lastShot = ts;
            }

            shootingStars = shootingStars.filter(s => s.a > 0.02);
            shootingStars.forEach(s => {
                s.trail.push({ x: s.x, y: s.y });
                if (s.trail.length > 20) s.trail.shift();
                s.x += s.vx; s.y += s.vy; s.a -= 0.022;

                if (s.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(s.trail[0].x, s.trail[0].y);
                    s.trail.forEach(p => ctx.lineTo(p.x, p.y));
                    const g = ctx.createLinearGradient(s.trail[0].x, s.trail[0].y, s.x, s.y);
                    g.addColorStop(0, 'transparent');
                    g.addColorStop(0.4, `rgba(192,132,252,${s.a * 0.3})`);
                    g.addColorStop(1,   `rgba(255,255,255,${s.a})`);
                    ctx.strokeStyle = g; ctx.lineWidth = 1.5; ctx.stroke();
                }

                const hg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 4);
                hg.addColorStop(0, `rgba(255,255,255,${s.a})`);
                hg.addColorStop(1, 'transparent');
                ctx.fillStyle = hg;
                ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
            });

            raf = requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('beforeunload', () => cancelAnimationFrame(raf));
        resize();
        raf = requestAnimationFrame(draw);
    })();

    (function initStatic() {
        const el   = document.getElementById('staticEl');
        const size = window.innerWidth < 768 ? 80 : 300;
        const interval = window.innerWidth < 768 ? 200 : 60;

        const c   = document.createElement('canvas');
        c.width   = c.height = size;
        const ctx = c.getContext('2d', { alpha: false });
        const img = ctx.createImageData(size, size);
        let last  = 0, raf;

        function gen(ts) {
            if (ts - last > interval) {
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    const v = Math.random() * 255;
                    d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255;
                }
                ctx.putImageData(img, 0, 0);
                el.style.backgroundImage = `url(${c.toDataURL()})`;
                el.style.backgroundSize  = `${size/2}px ${size/2}px`;
                last = ts;
            }
            raf = requestAnimationFrame(gen);
        }

        window.addEventListener('beforeunload', () => cancelAnimationFrame(raf));
        raf = requestAnimationFrame(gen);
    })();
    </script>
</body>
</html>
